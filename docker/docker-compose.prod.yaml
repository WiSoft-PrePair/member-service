services:
  database:
    image: postgres:17
    container_name: prepair-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - prepair-pg:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prepair-member-network
      - prepair-network

  app:
    image: ghcr.io/wisoft-prepair/backend-ts:latest
    #    build:
    #      context: ..
    #      dockerfile: Dockerfile
    container_name: prepair-backend-nestjs
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    ports:
      - '${PORT}:${PORT}'
    depends_on:
      database:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: backend.prepair
        fluentd-async: 'true'
    restart: unless-stopped
    networks:
      - prepair-member-network

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: prepair-fluent-bit
    ports:
      - '24224:24224'
    volumes:
      - ../fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ../fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prepair-member-network
      - logging-network

volumes:
  prepair-pg:

networks:
  prepair-member-network:
    driver: bridge

  logging-network:
    external: true
    name: logging-network
  prepair-network:
    external: true
