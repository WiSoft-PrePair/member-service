services:
  database:
    image: postgres:17
    container_name: prepair-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - prepair-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: prepair-fluent-bit
    volumes:
      - ./fluentbit/fluent-bit-file.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./logs:/logs
    environment:
      - SERVICE_NAME=prepair-member-logs
      - SERVICE_ENV=production
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-prepair}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    networks:
      - prepair-member-network
      - logging-network

volumes:
  prepair-pg:
  prepair-member-logs:

networks:
  prepair-member-network:
    driver: bridge

  logging-network:
    external: true
    name: logging-network
