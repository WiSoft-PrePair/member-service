# logging/fluent-bit-file.conf

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /logs/app.log
    Parser            json
    Tag               backend.prepair
    Read_from_Head    On
    Refresh_Interval  0.5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Rotate_Wait       1
    Ignore_Older      0

[FILTER]
    Name    modify
    Match   *
    Add     source fluent-bit
    Add     host ${HOSTNAME}

[OUTPUT]
    Name  es
    Match *
    Host  elasticsearch
    Port  9200
    HTTP_User elastic
    HTTP_Passwd ${ELASTIC_PASSWORD}
    Index prepair-member-service
    Type  _doc
    Retry_Limit 5
    Suppress_Type_Name On
