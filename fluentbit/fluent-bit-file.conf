# logging/fluent-bit-file.conf

# 1초마다 OUTPUT으로 로그를 전송
# fluentbit을 포그라운드에서 실행
# 자체 로그 레벨
# JSON 파싱 규칙 정의 파일
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    debug
    Parsers_File parsers.conf

# 파일을 계속 감시하면서 로그 수집
# fluentbit이 읽을 로그 파일 위치
# 로그 한 줄을 JSON으로 파싱
# 로그에 붙는 식별 태그
# 1초마다 파일 변경 여부 확인
# 메모리 버퍼 최대 크기, 초과시 드롭 가능
# 너무 긴 한줄 로그는 버림
# DB를 사용하여 읽은 위치 추적
[INPUT]
    Name              tail
    Path              /logs/app.log
    Parser            json
    Tag               backend.prepair
    Read_from_Head    On
    Refresh_Interval  1
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /var/lib/fluent-bit/tail-db.db
    DB.sync           normal
    Ignore_Older      0

# 로그 필드를 추가 / 수정하는 필터
# 모든 태그에 적용
# 서버가 여러 대 이면 어디 서버인지 알 수 있음
[FILTER]
    Name    modify
    Match   *
    Add     source fluent-bit
    Add     host ${HOSTNAME}

# ELK 플러그인 사용
# 모든 태그의 로그 전송
# docker 네트워크 기준 서비스 이름
# 로그가 저장될 인덱스 이름
# 전송 실패시 최대 5번 재시도
[OUTPUT]
    Name  es
    Match *
    Host  elasticsearch
    Port  9200
    HTTP_User ${ELASTIC_USERNAME}
    HTTP_Passwd ${ELASTIC_PASSWORD}
    Index prepair-member-service
    Type  _doc
    Retry_Limit 5
    Suppress_Type_Name On
