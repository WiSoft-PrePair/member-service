name: CD

on:
  workflow_run:
    workflows: [ 'CI' ]
    types: [ completed ]

jobs:
  deploy:
    name: Deploy to Wisoft Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # SSH 키 로드 (wisoft-auth)
      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WISOFT_SSH_PRIVATE_KEY }}

      # known_hosts 등록
      - name: Known Hosts 등록
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 10020 -H wisoft.io >> ~/.ssh/known_hosts

      # 서버 접속 후 배포
      - name: 서버에 배포
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -p 10020 student@wisoft.io /bin/bash << ENDSSH
            set -e

            echo "=== prepair 환경 진입 ==="
            prepair

            echo "=== 프로젝트 디렉토리 이동 ==="
            cd prepair/prepair-backend-ts

            echo "=== GHCR 로그인 ==="
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "=== 최신 이미지 Pull ==="
            docker compose -f docker/docker-compose.prod.yaml --env-file .env pull app

            echo "=== 앱 컨테이너 재시작 ==="
            docker compose -f docker/docker-compose.prod.yaml --env-file .env up -d app

            echo "=== Health Check (최대 60초) ==="
            for i in \$(seq 1 12); do
              if curl -sf http://localhost:7200/health > /dev/null; then
                echo "Health check 통과"
                exit 0
              fi
              echo "⏳ 재시도 \$i/12"
              sleep 5
            done

            echo "Health check 실패"
            docker compose logs --tail=50 app
            exit 1
          ENDSSH

      # 오래된 이미지 정리
      - name: 오래된 Docker 이미지 정리
        if: success()
        run: |
          ssh -p 10020 student@wisoft.io /bin/bash << ENDSSH
            docker image prune -af --filter "until=72h" || true
          ENDSSH
