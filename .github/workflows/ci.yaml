name: CI

on:
  push:
    branches:
      - "#*/**"
  pull_request:
    branches:
      - "#*/**"

jobs:
  # ============================================
  # Job 1: app 체크 + 테스트
  # ============================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # 테스트용 PostgreSQL 컨테이너
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prepair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'       # pnpm 의존성 캐시

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 테스트 실행
        env:
          NODE_ENV: test
          PORT: 7200
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prepair_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
          JWT_REFRESH_TOKEN_EXPIRES_IN: 7d
          SMTP_HOST: smtp.test.com
          SMTP_USER: test@test.com
          SMTP_PASS: testpass
          SMTP_FROM: noreply@test.com
          KAKAO_CLIENT_ID: test-kakao-client
          KAKAO_CLIENT_SECRET: test-kakao-secret
          KAKAO_REDIRECT_URI: http://localhost:7200/oauth/kakao/callback
        run: pnpm run test

  # ============================================
  # Job 2: Docker 이미지 빌드 + GHCR 푸시
  # ============================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                         # test job 성공 후 실행
#    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # main push만
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write                   # GHCR에 이미지 푸시 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 설정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64        # 라즈베리파이용 ARM64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions 캐시 사용
          cache-to: type=gha,mode=max

  # ============================================
  # Job 3: 서버 배포
  # ============================================
  deploy:
    name: Deploy to Wisoft Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RASPI_SSH_PRIVATE_KEY }}

      - name: Known Hosts 등록
        env:
          JUMP_PORT: ${{ secrets.RASPI_SSH_PORT }}
          JUMP_HOST: ${{ secrets.RASPI_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $JUMP_PORT -H $JUMP_HOST >> ~/.ssh/known_hosts

      - name: 서버에 배포
        env:
          JUMP_PORT: ${{ secrets.RASPI_SSH_PORT }}
          JUMP_HOST: ${{ secrets.RASPI_HOST }}
          JUMP_USER: ${{ secrets.RASPI_USER }}
          TARGET_HOST: ${{ secrets.RASPI_TARGET_HOST }}
          TARGET_USER: ${{ secrets.RASPI_TARGET_USER }}
          DEPLOY_PATH: ${{ secrets.RASPI_DEPLOY_PATH }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -o ProxyJump=$JUMP_USER@$JUMP_HOST:$JUMP_PORT $TARGET_USER@$TARGET_HOST /bin/bash << ENDSSH
            set -e

            echo "=== 배포 디렉토리 이동 ==="
            cd $DEPLOY_PATH

            echo "=== GHCR 로그인 ==="
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "=== 최신 이미지 Pull ==="
            docker compose -f docker/docker-compose.prod.yaml --env-file .env pull app

            echo "=== 앱 컨테이너 재시작 ==="
            docker compose -f docker/docker-compose.prod.yaml --env-file .env up -d app

            echo "=== Health Check (최대 60초) ==="
            for i in \$(seq 1 12); do
              if curl -sf http://localhost:7200/health > /dev/null; then
                echo "Health check 통과"
                exit 0
              fi
              echo "⏳ 재시도 \$i/12"
              sleep 5
            done

            echo "Health check 실패"
            docker compose logs --tail=50 app
            exit 1
          ENDSSH

      - name: 오래된 Docker 이미지 정리
        if: success()
        env:
          JUMP_PORT: ${{ secrets.RASPI_SSH_PORT }}
          JUMP_HOST: ${{ secrets.RASPI_HOST }}
          JUMP_USER: ${{ secrets.RASPI_USER }}
          TARGET_HOST: ${{ secrets.RASPI_TARGET_HOST }}
          TARGET_USER: ${{ secrets.RASPI_TARGET_USER }}
        run: |
          ssh -o ProxyJump=$JUMP_USER@$JUMP_HOST:$JUMP_PORT $TARGET_USER@$TARGET_HOST /bin/bash << ENDSSH
            docker image prune -af --filter "until=72h" || true
          ENDSSH
