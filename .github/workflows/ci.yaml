name: CI

on:
  push:
    branches:
      - "#*/**"
  pull_request:
    branches:
      - "#*/**"

jobs:
  # ============================================
  # Job 1: app 체크 + 테스트
  # ============================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # 테스트용 PostgreSQL 컨테이너
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prepair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'       # pnpm 의존성 캐시

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 테스트 실행
        env:
          NODE_ENV: test
          PORT: 7200
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prepair_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
          JWT_REFRESH_TOKEN_EXPIRES_IN: 7d
          SMTP_HOST: smtp.test.com
          SMTP_USER: test@test.com
          SMTP_PASS: testpass
          SMTP_FROM: noreply@test.com
          KAKAO_CLIENT_ID: test-kakao-client
          KAKAO_CLIENT_SECRET: test-kakao-secret
          KAKAO_REDIRECT_URI: http://localhost:7200/oauth/kakao/callback
        run: pnpm run test

  # ============================================
  # Job 2: Docker 이미지 빌드 + GHCR 푸시
  # ============================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                         # test job 성공 후 실행
#    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # main push만
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write                   # GHCR에 이미지 푸시 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 설정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64        # 라즈베리파이용 ARM64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions 캐시 사용
          cache-to: type=gha,mode=max
